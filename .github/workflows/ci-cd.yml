name: Payments Platform CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write   # Passwordless OIDC authentication with Azure
  contents: read

jobs:
  ci-checks:
    name: CI — Format, Tests, Coverage & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Gate 1: Code formatting & style linting (Spotless / Checkstyle)
      - name: Verify code formatting and style
        run: mvn -f practical/pom.xml spotless:check

      # Gate 2: Run unit/integration tests and enforce minimum test coverage (JaCoCo >= 80%)
      - name: Run tests and enforce JaCoCo coverage threshold
        run: mvn -f practical/pom.xml verify -Djacoco.haltOnFailure=true

      # Gate 3: Validate Azure Bicep infrastructure syntax
      - name: Validate Bicep template
        run: az bicep build --file infra/main.bicep

      # Gate 4: Scan repository for accidentally committed secrets (NFR6)
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: CD — Deploy to Dev
    needs: build-and-validate
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep to Dev
        run: |
          az deployment group create \
            --resource-group rg-meridian-payments-dev \
            --template-file infra/main.bicep \
            --parameters environment=dev

  deploy-test:
    name: CD — Deploy to Test
    needs: deploy-dev
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep to Test
        run: |
          az deployment group create \
            --resource-group rg-meridian-payments-test \
            --template-file infra/main.bicep \
            --parameters environment=test

  deploy-prod:
    name: CD — Deploy to Prod
    needs: deploy-test
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview Prod Infrastructure Changes (what-if)
        run: |
          az deployment group what-if \
            --resource-group rg-meridian-payments-prod \
            --template-file infra/main.bicep \
            --parameters environment=prod
      - name: Deploy Bicep to Prod
        run: |
          az deployment group create \
            --resource-group rg-meridian-payments-prod \
            --template-file infra/main.bicep \
            --parameters environment=prod
