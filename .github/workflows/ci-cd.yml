name: Payments Platform CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write   # Passwordless OIDC authentication with Azure
  contents: read

jobs:
  ci-checks:
    name: CI — Format, Tests, Coverage & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Gate 1: Code formatting & style linting (Spotless / Checkstyle)
      - name: Verify code formatting and style
        run: mvn -f practical/pom.xml spotless:check

      # Gate 2: Run unit/integration tests and enforce minimum test coverage (JaCoCo >= 80%)
      - name: Run tests and enforce JaCoCo coverage threshold
        run: mvn -f practical/pom.xml verify -Djacoco.haltOnFailure=true

      # Gate 3: Scan Maven dependencies for known HIGH/CRITICAL vulnerabilities (CVEs)
      - name: Scan dependencies for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'practical'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # Gate 4: Validate Azure Bicep infrastructure syntax
      - name: Validate Bicep template
        run: az bicep build --file infra/main.bicep

      # Gate 5: Scan repository for accidentally committed secrets (NFR6)
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: CD — Deploy to Dev
    needs: ci-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure (Dev)
        run: |
          az deployment group create \
            --resource-group meridian-pay-dev-rg \
            --template-file infra/main.bicep \
            --parameters environment=dev logAnalyticsWorkspaceId=${{ vars.LOG_ANALYTICS_ID }}

  deploy-test:
    name: CD — Deploy to Test
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure (Test)
        run: |
          az deployment group create \
            --resource-group meridian-pay-test-rg \
            --template-file infra/main.bicep \
            --parameters environment=test logAnalyticsWorkspaceId=${{ vars.LOG_ANALYTICS_ID }}

  deploy-prod:
    name: CD — Deploy to Prod (Manual Approval)
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod # Requires manual reviewer approval in GitHub Environments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure (Prod)
        run: |
          az deployment group create \
            --resource-group meridian-pay-prod-rg \
            --template-file infra/main.bicep \
            --parameters environment=prod logAnalyticsWorkspaceId=${{ vars.LOG_ANALYTICS_ID }}
